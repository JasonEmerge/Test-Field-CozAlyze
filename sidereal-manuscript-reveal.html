<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Your Story Written in the Stars</title>
<!-- MANUSCRIPT REVEAL · SIDEREAL · v1 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --wood-1:#1c1108; --wood-2:#2e1c0d;
  --paper-1:#e8d5a8; --paper-2:#d9bf8a; --paper-3:#c4a468;
  --ink:#3a2a16; --ink-soft:#4a3820;
  --gold:#c9a35c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#000;
  font-family:'EB Garamond',Georgia,serif;
  overflow:hidden;              /* unlocked after the reveal completes */
  -webkit-text-size-adjust:100%;
}

/* ---------- STAGE / DESK ---------- */
#stage{
  position:relative;
  min-height:100dvh;
  padding:6dvh 5vw 10dvh;
  display:flex; justify-content:center;
  opacity:0;
  transition:opacity 2.8s ease;
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(90,55,20,.25), transparent 60%),
    linear-gradient(180deg, var(--wood-2), var(--wood-1) 55%, #120a04);
}
#stage.on{opacity:1}
/* faint wood grain */
#stage::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.008 0.09' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.06  0 0 0 0 0.02  0 0 0 0.5 0'/></filter><rect width='300' height='300' filter='url(%23g)'/></svg>");
}

/* ---------- PARCHMENT ---------- */
#sheet{
  position:relative;
  width:min(680px,100%);
  padding:clamp(28px,7vw,64px) clamp(22px,6vw,58px) clamp(48px,9vw,80px);
  background:
    radial-gradient(140% 90% at 50% 0%, rgba(255,244,214,.55), transparent 55%),
    radial-gradient(90% 60% at 8% 100%, rgba(120,84,36,.35), transparent 60%),
    radial-gradient(90% 60% at 95% 90%, rgba(120,84,36,.30), transparent 60%),
    linear-gradient(165deg, var(--paper-1) 0%, var(--paper-2) 55%, var(--paper-3) 100%);
  clip-path:polygon(1.2% 0.4%, 8% 0%, 16% .7%, 27% .1%, 38% .8%, 50% .2%, 61% .9%, 73% .2%, 84% .8%, 93% .1%, 98.8% .9%, 99.6% 8%, 99.1% 18%, 99.8% 30%, 99.2% 43%, 99.9% 56%, 99.3% 69%, 99.8% 81%, 99.2% 92%, 98.6% 99.4%, 91% 99.9%, 80% 99.2%, 68% 99.9%, 55% 99.3%, 43% 99.9%, 31% 99.2%, 19% 99.8%, 9% 99.1%, 1.6% 99.7%, .3% 93%, .9% 82%, .2% 70%, .8% 57%, .1% 44%, .9% 31%, .3% 19%, .8% 9%);
  box-shadow:0 30px 80px rgba(0,0,0,.75);
}
/* paper fiber grain */
#sheet::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.44  0 0 0 0 0.26  0 0 0 0.12 0'/></filter><rect width='240' height='240' filter='url(%23p)'/></svg>");
}
/* final rest glow */
#sheet::after{
  content:""; position:absolute; inset:-4%; pointer-events:none; opacity:0;
  background:radial-gradient(60% 45% at 50% 30%, rgba(255,230,170,.35), transparent 70%);
  transition:opacity 3.5s ease;
}
#sheet.glow::after{opacity:1}

/* ---------- TITLE BLOCK ---------- */
#titleBlock{text-align:center; margin-bottom:clamp(26px,6vw,44px)}
.wline{display:inline-block; clip-path:inset(-10% 100% -10% 0); will-change:clip-path}
#nameLine{
  font-family:'Tangerine',cursive;
  font-size:clamp(64px,19vw,124px);
  line-height:.95;
  color:var(--ink);
  text-shadow:0 1px 0 rgba(255,244,214,.4);
}
.rule{
  height:1px; width:min(220px,55%); margin:10px auto 14px;
  background:linear-gradient(90deg,transparent,var(--ink-soft),transparent);
  position:relative; opacity:0; transition:opacity 1.4s ease;
}
.rule.on{opacity:.8}
.rule::after{
  content:"✦"; position:absolute; left:50%; top:50%; transform:translate(-50%,-52%);
  font-size:10px; color:var(--ink-soft); background:transparent;
}
#titleLine{
  font-size:clamp(17px,4.6vw,26px);
  letter-spacing:.14em;
  font-variant:small-caps;
  font-weight:500;
  color:var(--ink);
}
#lensLine{
  margin-top:6px;
  font-style:italic;
  font-size:clamp(14px,3.8vw,19px);
  color:var(--ink-soft);
  letter-spacing:.04em;
}

/* ---------- BODY ---------- */
.para{
  font-size:clamp(15.5px,4.1vw,19px);
  line-height:1.62;
  color:var(--ink);
  opacity:0;
  transform:translateY(10px);
  transition:opacity 1.6s ease, transform 1.6s ease;
}
.para.on{opacity:1; transform:none}
.sep{
  margin:clamp(18px,4.5vw,28px) auto;
  height:1px; width:min(180px,45%);
  background:linear-gradient(90deg,transparent,rgba(74,56,32,.55),transparent);
  position:relative; opacity:0; transition:opacity 1.6s ease;
}
.sep.on{opacity:1}
.sep::after{
  content:"✦"; position:absolute; left:50%; top:50%; transform:translate(-50%,-52%);
  font-size:9px; color:var(--ink-soft);
}
#closer{
  margin-top:clamp(24px,6vw,40px); text-align:center;
  font-size:16px; color:var(--ink-soft); letter-spacing:.3em;
  opacity:0; transition:opacity 2s ease;
}
#closer.on{opacity:.85}

/* ---------- INK BOTTLE ---------- */
#inkwell{
  position:absolute;
  top:clamp(-14px,-2vw,-6px); left:clamp(-10px,-1vw,4px);
  width:clamp(64px,17vw,96px);
  filter:drop-shadow(0 10px 14px rgba(0,0,0,.55));
}
#ripples circle{
  fill:none; stroke:#d8b76a; stroke-width:1; opacity:0;
  transform-origin:50px 34px;
}
#ripples.play circle{animation:rip 1.2s ease-out forwards}
#ripples.play circle:nth-child(2){animation-delay:.18s}
#ripples.play circle:nth-child(3){animation-delay:.36s}
@keyframes rip{
  0%{opacity:.9; transform:scale(.2)}
  100%{opacity:0; transform:scale(1.15)}
}

/* ---------- PEN ---------- */
#pen{
  position:fixed; left:0; top:0; z-index:40;
  width:clamp(38px,10vw,52px);
  pointer-events:none;
  will-change:transform;
  filter:drop-shadow(4px 10px 10px rgba(0,0,0,.5));
}
#penBob{will-change:transform}
#penBob.write{animation:bob .28s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-.8deg)}to{transform:translateY(2.5px) rotate(.8deg)}}
#nibShine{opacity:0}
#nibShine.play{animation:shine 1.3s ease-in-out}
@keyframes shine{0%{opacity:0}45%{opacity:1}100%{opacity:0}}
#drop{opacity:0; transition:opacity .5s ease}
#drop.on{opacity:1}

/* ---------- TAP CURTAIN ---------- */
#curtain{
  position:fixed; inset:0; z-index:100;
  background:#000;
  display:flex; align-items:center; justify-content:center;
  transition:opacity 1.6s ease;
}
#curtain.gone{opacity:0; pointer-events:none}
#tapPrompt{
  color:#bfa06a; font-size:15px; letter-spacing:.42em; font-variant:small-caps;
  animation:breathe 3.2s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.85}}

/* build tag */
#tag{position:fixed; right:8px; bottom:6px; z-index:99; font-size:9px; letter-spacing:.08em; color:rgba(201,163,92,.35); font-family:Georgia,serif; pointer-events:none}

@media (prefers-reduced-motion:reduce){
  #stage,.para,.sep,.rule,#closer{transition:none}
  #penBob.write,#tapPrompt{animation:none}
}
</style>
</head>
<body>

<div id="curtain"><div id="tapPrompt">tap to begin</div></div>
<div id="tag">MANUSCRIPT · SIDEREAL · v1</div>

<div id="stage">
  <div id="sheet">

    <!-- ink bottle, resting top-left -->
    <svg id="inkwell" viewBox="0 0 100 110" aria-hidden="true">
      <path d="M22 44 L30 30 L70 30 L78 44 L78 92 Q78 100 70 100 L30 100 Q22 100 22 92 Z"
            fill="#14100c" stroke="#2c2318" stroke-width="1.5"/>
      <path d="M26 48 L32 36 L40 36 L34 48 L34 90 L26 90 Z" fill="rgba(255,255,255,.06)"/>
      <rect x="34" y="16" width="32" height="16" rx="2" fill="#0d0a07" stroke="#2c2318"/>
      <ellipse cx="50" cy="34" rx="17" ry="5.5" fill="#050403"/>
      <ellipse cx="50" cy="34" rx="13" ry="4" fill="#0a0705"/>
      <ellipse cx="45" cy="33" rx="4" ry="1.3" fill="rgba(201,163,92,.25)"/>
      <g id="ripples">
        <circle cx="50" cy="34" r="11"/>
        <circle cx="50" cy="34" r="11"/>
        <circle cx="50" cy="34" r="11"/>
      </g>
    </svg>

    <div id="titleBlock">
      <div id="nameLine" class="wline">Jason</div>
      <div class="rule" id="rule1"></div>
      <div id="titleLine" class="wline">Your Story Written in the Stars</div>
      <div id="lensLine" class="wline">— through the Sidereal Lens —</div>
      <div class="rule" id="rule2"></div>
    </div>

    <div id="body"></div>

    <div id="closer">✦</div>
  </div>
</div>

<!-- fountain pen (nib tip at viewBox 20,158) -->
<svg id="pen" viewBox="0 0 40 160" aria-hidden="true">
  <g id="penBob">
    <rect x="13" y="2" width="14" height="70" rx="6" fill="#161210"/>
    <rect x="15" y="4" width="4" height="66" rx="2" fill="rgba(255,255,255,.08)"/>
    <rect x="12" y="72" width="16" height="8" rx="2" fill="#c9a35c"/>
    <path d="M14 80 L26 80 L24 108 L16 108 Z" fill="#1c1712"/>
    <path d="M16 108 L24 108 L21.5 132 L18.5 132 Z" fill="#2a221a"/>
    <path d="M20 158 L11 128 Q20 118 29 128 Z" fill="#d8b76a" stroke="#8a6a30" stroke-width="1"/>
    <line x1="20" y1="152" x2="20" y2="128" stroke="#8a6a30" stroke-width="1.2"/>
    <circle cx="20" cy="128" r="1.6" fill="#8a6a30"/>
    <circle id="nibShine" cx="20" cy="146" r="5" fill="url(#shineGrad)"/>
    <circle id="drop" cx="20" cy="156" r="3.2" fill="url(#dropGrad)"/>
  </g>
  <defs>
    <radialGradient id="shineGrad"><stop offset="0%" stop-color="#fff8e0" stop-opacity=".95"/><stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/></radialGradient>
    <radialGradient id="dropGrad"><stop offset="0%" stop-color="#f4dc9a"/><stop offset="70%" stop-color="#b98c3e"/><stop offset="100%" stop-color="#6d4c1c"/></radialGradient>
  </defs>
</svg>

<script>
/* ================= MANUSCRIPT DATA =================
   The reading engine injects window.EMERGE_MANUSCRIPT
   before this file loads; sample below is fallback. */
const M = window.EMERGE_MANUSCRIPT || {
  name: "Jason",
  lens: "Sidereal",
  paragraphs: [
    "Your chart reveals a soul that is here to illuminate through service, creativity, and compassion. You are not here to chase the spotlight; you are here to become the light that quietly changes lives. At your core is a deep sensitivity and intuition that picks up what others feel but may not say. You are a natural healer, guide, and understander, and your path becomes most meaningful when you use these gifts to uplift, inspire, and help others reconnect with their own truth.",
    "Pisces rising gives you a compassionate and intuitive nature, while Ketu in the Ascendant shows that you carry ancient wisdom from past journeys. You are here to release what no longer serves you and live from faith, not fear. Across from this, Rahu in Virgo calls you toward discernment, healthy relationships, and practical service. Your life is a dance between surrender and refinement, trusting the flow of the universe while also bringing order, structure, and healing into the world.",
    "Your Sun and Mercury in Leo in the Sixth House tell the story of a purpose that unfolds through meaningful work. You are here to lead, create, and express yourself in ways that improve, uplift, and bring light into the everyday lives of others. Your voice, your ideas, and your willingness to take initiative are your tools. You thrive when your work is aligned with heart, when it allows you to use your creativity and intelligence in service of something greater.",
    "Venus and Jupiter in Gemini in the Fourth House bless you with a curious mind, a love of learning, and a gift for connection. You are nourished by conversations that expand your perspective and by environments that stimulate your imagination. You are here to create a foundation, both within yourself and in your home, that supports growth, wisdom, and meaningful connection.",
    "Mars in Taurus in the Third House gives you steady determination and the ability to turn ideas into action. You may move at your own pace, but once committed, your persistence is unstoppable. Saturn in Cancer in the Fifth House teaches that emotional maturity, creativity, and joy are qualities that must be earned through responsibility and self-trust. Over time, you build something beautiful that lasts.",
    "Your Libra Moon in the Eighth House reveals a heart that seeks depth, honesty, and soulful connection. Relationships are not casual for you, they are pathways of transformation. You are here to build trust, merge in meaningful ways, and heal through intimacy and emotional truth. You are never afraid to go where life is real, knowing that every ending is an invitation to be reborn.",
    "In every way, your chart is guiding you toward a life of meaning, service, and authenticity. You are here to blend intuition with wisdom, creativity with discipline, and compassion with strength. When you honor every part of who you are, your sensitivity, your ambition, your heart, and your depth, you become exactly what this chart was designed to create: a guide, a healer, and a light for others."
  ]
};

/* ================= TIMING (ms) ================= */
const T = {
  blackHold:      1000,
  parchmentIn:    2800,
  settle:          800,
  nibShimmer:     1300,
  liftToInk:      2100,
  dip:            1300,
  toTitle:        1600,
  writeName:      2300,
  hop:             450,
  writeTitle:     1700,
  writeLens:      1300,
  returnHome:     1900,
  stillBeat:       700,
  paraFade:       1600,
  paraStagger:     550
};

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const stage=$('stage'), sheet=$('sheet'), pen=$('pen'), penBob=$('penBob'),
      nameLine=$('nameLine'), titleLine=$('titleLine'), lensLine=$('lensLine');

lensLine.textContent = `— through the ${M.lens} Lens —`;
nameLine.textContent = M.name;

/* build body paragraphs + separators */
const bodyEl=$('body');
M.paragraphs.forEach((p,i)=>{
  if(i>0){const s=document.createElement('div');s.className='sep';bodyEl.appendChild(s);}
  const d=document.createElement('div');d.className='para';d.textContent=p;bodyEl.appendChild(d);
});

/* ---------- pen positioning ----------
   Nib tip lives at (20,158) of a 0-0-40-160 viewBox.
   place(x,y,rot): puts the nib tip at viewport point x,y. */
let penW=0, penH=0, curAnim=null;
function penMetrics(){ const r=pen.getBoundingClientRect(); penW=r.width; penH=r.height; }
function tipOffset(){ return { x: penW*(20/40), y: penH*(158/160) }; }
function penTransform(x,y,rot){
  const o=tipOffset();
  return `translate(${x-o.x}px, ${y-o.y}px) rotate(${rot}deg)`;
}
function movePen(x,y,rot,ms,ease='cubic-bezier(.45,.05,.3,1)'){
  return new Promise(res=>{
    const to=penTransform(x,y,rot);
    if(reduced||ms===0){ pen.style.transform=to; res(); return; }
    const from=getComputedStyle(pen).transform;
    pen.getAnimations().forEach(a=>a.cancel());
    curAnim=pen.animate([{transform:from==='none'?to:from},{transform:to}],{duration:ms,easing:ease,fill:'forwards'});
    curAnim.onfinish=()=>{ pen.style.transform=to; res(); };
  });
}
/* write a line: linear nib sweep synced to a clip-path reveal */
function writeLine(el,ms){
  return new Promise(res=>{
    const r=el.getBoundingClientRect();
    const y=r.top + r.height*0.72;
    const rot=-32;
    if(reduced){ el.style.clipPath='none'; res(); return; }
    pen.getAnimations().forEach(a=>a.cancel());
    pen.style.transform=penTransform(r.left,y,rot);
    penBob.classList.add('write');
    el.animate(
      [{clipPath:'inset(-10% 100% -10% 0)'},{clipPath:'inset(-10% -2% -10% 0)'}],
      {duration:ms,easing:'linear',fill:'forwards'}
    ).onfinish=()=>{ el.style.clipPath='none'; };
    pen.animate(
      [{transform:penTransform(r.left,y,rot)},{transform:penTransform(r.right,y,rot)}],
      {duration:ms,easing:'linear',fill:'forwards'}
    ).onfinish=()=>{
      pen.style.transform=penTransform(r.right,y,rot);
      penBob.classList.remove('write');
      res();
    };
  });
}

/* ---------- ambient 174 field (inline, steady, no beating) ---------- */
let AC=null;
function startTone(){
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
    /* reference DNA: 87 Hz dominant floor, 43.5 sub, 174 faint — all dead steady */
    [[43.5,.35],[87,.6],[174,.14],[196,.06]].forEach(([f,g])=>{
      const o=AC.createOscillator(), gn=AC.createGain();
      o.type='sine'; o.frequency.value=f; gn.gain.value=g;
      o.connect(gn); gn.connect(master); o.start();
    });
    master.gain.linearRampToValueAtTime(0.10, AC.currentTime+5);
    window.EMERGE_TONE_MASTER=master; /* external fade-out handle */
  }catch(e){}
}

/* ================= SEQUENCE ================= */
async function run(){
  await sleep(T.blackHold);

  /* parchment appears */
  stage.classList.add('on');
  await sleep(T.parchmentIn + T.settle);

  penMetrics();
  const ink=$('inkwell').getBoundingClientRect();
  const inkMouth={ x: ink.left+ink.width*0.5, y: ink.top+ink.height*0.31 };
  const sr=sheet.getBoundingClientRect();
  const rest={ x: Math.min(innerWidth-18, sr.right-14), y: sr.top+ink.height*0.55, rot: 58 };

  /* pen resting on the right, like the still image */
  pen.style.transform=penTransform(rest.x,rest.y,rest.rot);
  pen.style.opacity=1;

  /* the pen awakens */
  $('nibShine').classList.add('play');
  await sleep(T.nibShimmer);

  /* lift, drift to the ink */
  await movePen(rest.x-30, rest.y-46, 20, 700, 'ease-out');
  await movePen(inkMouth.x, inkMouth.y-70, -8, T.liftToInk-700);

  /* dip */
  await movePen(inkMouth.x, inkMouth.y, -4, 520, 'ease-in');
  $('ripples').classList.add('play');
  await sleep(T.dip-520);
  $('drop').classList.add('on');
  await movePen(inkMouth.x, inkMouth.y-64, -12, 620, 'ease-out');

  /* to the page, and write */
  const nr=nameLine.getBoundingClientRect();
  await movePen(nr.left, nr.top+nr.height*0.72, -32, T.toTitle);
  await writeLine(nameLine, T.writeName);
  $('rule1').classList.add('on');

  const tr=titleLine.getBoundingClientRect();
  await movePen(tr.left, tr.top+tr.height*0.72, -32, T.hop, 'ease-in-out');
  await writeLine(titleLine, T.writeTitle);

  const lr=lensLine.getBoundingClientRect();
  await movePen(lr.left, lr.top+lr.height*0.72, -32, T.hop, 'ease-in-out');
  await writeLine(lensLine, T.writeLens);
  $('rule2').classList.add('on');
  $('drop').classList.remove('on');

  /* the pen returns */
  await movePen(rest.x-24, rest.y-56, 30, T.returnHome*0.55, 'ease-in-out');
  await movePen(rest.x, rest.y, rest.rot, T.returnHome*0.45, 'ease-in');
  await sleep(T.stillBeat);

  /* the story appears — paper remembering */
  const pieces=[...bodyEl.children];
  for(const el of pieces){
    el.classList.add('on');
    if(el.classList.contains('para')) await sleep(T.paraStagger);
  }
  await sleep(T.paraFade);

  /* final moment */
  $('closer').classList.add('on');
  sheet.classList.add('glow');
  document.body.style.overflow='auto';
  window.dispatchEvent(new CustomEvent('EMERGE_MANUSCRIPT_COMPLETE',{detail:{lens:M.lens}}));
}

/* reduced motion: everything simply present */
function runReduced(){
  stage.classList.add('on');
  [nameLine,titleLine,lensLine].forEach(el=>el.style.clipPath='none');
  document.querySelectorAll('.rule,.sep,.para,#closer').forEach(el=>el.classList.add('on'));
  penMetrics();
  const sr=sheet.getBoundingClientRect();
  pen.style.transform=penTransform(Math.min(innerWidth-18,sr.right-14), sr.top+60, 58);
  pen.style.opacity=1;
  sheet.classList.add('glow');
  document.body.style.overflow='auto';
  window.dispatchEvent(new CustomEvent('EMERGE_MANUSCRIPT_COMPLETE',{detail:{lens:M.lens}}));
}

/* ---------- gate on the tap (iOS audio + intent) ---------- */
pen.style.opacity=0;
$('curtain').addEventListener('pointerup', function go(){
  $('curtain').removeEventListener('pointerup', go);
  startTone();                       /* swap for EMERGE_SOUND cue when wiring */
  $('curtain').classList.add('gone');
  document.fonts.ready.then(()=> reduced ? runReduced() : run());
},{once:true});
</script>
</body>
</html>
