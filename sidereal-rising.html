<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Sidereal Rising — Living Ascendants v1</title>
<style>
  :root{--ink:#05070f;--gold:#e8b968;--gold-dim:rgba(232,185,104,.4)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--ink)}
  body{font-family:Georgia,serif;color:var(--gold);display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden;
    padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 0%,#0b1023 0%,var(--ink) 65%)}
  .wordmark{letter-spacing:.32em;font-size:clamp(14px,4vw,18px)}
  .tagline{font-style:italic;font-size:clamp(9px,2.6vw,11px);letter-spacing:.12em;color:var(--gold-dim);margin:2px 0 10px}

  .card{position:relative;width:min(94vw,540px);max-height:70vh;
    border:1px solid rgba(232,185,104,.28);border-radius:16px;overflow:hidden;
    background:#080c1c;box-shadow:0 0 50px rgba(20,40,110,.3)}
  .stage{position:relative;width:100%;overflow:hidden}
  .heroWrap{position:absolute;inset:0;transform-origin:50% 55%;will-change:transform;
    transition:transform .3s cubic-bezier(.22,1,.36,1)}
  .heroWrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  canvas.fx{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
  .flash{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;pointer-events:none;
    background:radial-gradient(circle at var(--fx,50%) var(--fy,40%),rgba(255,240,210,.9) 0%,rgba(255,205,120,.3) 24%,transparent 55%)}
  .arrow{position:absolute;left:0;top:0;height:0;transform-origin:0 50%;opacity:0;pointer-events:none;will-change:transform,opacity}
  .arrow svg{position:absolute;left:0;top:50%;transform:translateY(-50%);overflow:visible}
  .trail{position:absolute;left:0;top:0;height:3px;transform-origin:0 50%;opacity:0;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,233,189,.85) 70%,#fff);border-radius:2px;
    filter:blur(.5px) drop-shadow(0 0 6px rgba(255,215,140,.9));will-change:transform,opacity}

  .signName{padding:12px 14px 14px;text-align:center;border-top:1px solid rgba(232,185,104,.16)}
  .signName b{display:block;font-weight:400;font-size:clamp(20px,6vw,28px);letter-spacing:.22em;color:#f3d9a4;
    text-shadow:0 0 20px rgba(232,185,104,.35)}
  .signName span{display:block;font-size:clamp(10px,2.8vw,12px);letter-spacing:.4em;margin-top:4px;color:var(--gold-dim)}

  .chips{display:flex;gap:8px;overflow-x:auto;max-width:min(94vw,540px);padding:14px 2px 4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid rgba(232,185,104,.35);border-radius:999px;
    padding:7px 14px;font-size:11px;letter-spacing:.14em;color:var(--gold);background:transparent;
    font-family:inherit}
  .chip.on{background:rgba(232,185,104,.16);border-color:var(--gold);color:#ffe9bd}
  .hint{margin-top:8px;font-size:10px;letter-spacing:.26em;color:rgba(232,185,104,.45);text-transform:uppercase}
</style>
</head>
<body>

<div class="wordmark">SIDEREAL RISING</div>
<div class="tagline">Living Ascendants · v1</div>

<div class="card">
  <div class="stage" id="stage">
    <div class="heroWrap" id="heroWrap"><img id="heroImg" alt=""></div>
    <canvas class="fx" id="fx"></canvas>
    <div class="trail" id="trail"></div>
    <div class="arrow" id="arrowEl"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="signName"><b id="nm"></b><span>ASCENDANT</span></div>
</div>

<div class="chips" id="chips"></div>
<div class="hint">Tap the art to awaken</div>

<script>
/* ============ SIGN CONFIGS — every coordinate is a fraction of the image ============ */
const SIGNS = {
  aries:{ name:'ARIES', img:'aries.jpg', fx:[
    {t:'pulse',x:.492,y:.155,r:.07,p:4200},
    {t:'sweep',p:12000},
    {t:'sig',kind:'stomp',x:.5,y:.92}]},
  taurus:{ name:'TAURUS', img:'taurus.jpg', breathe:1.05, fx:[
    {t:'pulse',x:.5,y:.115,r:.06,p:5200},
    {t:'pulse',x:.53,y:.72,r:.045,p:3800},
    {t:'sweep',p:15000},
    {t:'sig',kind:'swell',x:.5,y:.55}]},
  gemini:{ name:'GEMINI', img:'gemini.jpg', fx:[
    {t:'pulse',x:.49,y:.135,r:.06,p:4600},
    {t:'alt',ax:.33,ay:.6,bx:.66,by:.58,r:.2,p:6400},
    {t:'sparks',x:.5,y:.34,p:5200,n:6},
    {t:'sig',kind:'swell',x:.5,y:.45}]},
  cancer:{ name:'CANCER', img:'cancer.jpg', fx:[
    {t:'pulse',x:.49,y:.16,r:.06,p:4600},
    {t:'pulse',x:.47,y:.44,r:.08,p:5600},
    {t:'alt',ax:.35,ay:.42,bx:.64,by:.4,r:.13,p:7200},
    {t:'ring',x:.5,y:.9,p:5200,mr:.3},
    {t:'sig',kind:'swell',x:.47,y:.44}]},
  leo:{ name:'LEO', img:'leo.jpg', fx:[
    {t:'pulse',x:.5,y:.14,r:.06,p:4600},
    {t:'sweep',p:11000},
    {t:'sparks',x:.55,y:.42,p:6400,n:4,s:.5},
    {t:'sig',kind:'roar',x:.53,y:.45}]},
  virgo:{ name:'VIRGO', img:'virgo.jpg', fx:[
    {t:'pulse',x:.5,y:.125,r:.055,p:4800},
    {t:'pulse',x:.77,y:.87,r:.05,p:4200},
    {t:'emit',x1:.34,y1:.78,x2:.5,y2:.8,dx:0,dy:-.028,rate:.35,life:3200,sz:1.4},
    {t:'sig',kind:'swell',x:.44,y:.72}]},
  libra:{ name:'LIBRA', img:'libra.jpg', fx:[
    {t:'pulse',x:.5,y:.115,r:.055,p:4800},
    {t:'alt',ax:.21,ay:.78,bx:.79,by:.77,r:.12,p:8200},
    {t:'emit',x1:.12,y1:-.02,x2:.88,y2:-.02,dx:.004,dy:.02,rate:.18,life:6000,sz:1.6},
    {t:'sig',kind:'swell',x:.5,y:.5}]},
  scorpio:{ name:'SCORPIO', img:'scorpio.jpg', fx:[
    {t:'pulse',x:.5,y:.11,r:.055,p:4600},
    {t:'flicker',pts:[[.065,.86],[.9,.82],[.06,.955],[.93,.95]],r:.035},
    {t:'sig',kind:'sting',x:.42,y:.36}]},
  sagittarius:{ name:'SAGITTARIUS', img:'sagittarius.jpg', fx:[
    {t:'pulse',x:.51,y:.11,r:.06,p:4600},
    {t:'sig',kind:'arrow'}],
    arrow:{ax:.815,ay:.303,deg:-7.5,shaft:.38,draw:.055}},
  capricorn:{ name:'CAPRICORN', img:'capricorn.jpg', fx:[
    {t:'pulse',x:.49,y:.115,r:.055,p:4800},
    {t:'pulse',x:.41,y:.66,r:.05,p:4200},
    {t:'emit',x1:.55,y1:.8,x2:.74,y2:.88,dx:0,dy:-.012,rate:.22,life:2600,sz:1.3},
    {t:'sweep',p:16000},
    {t:'sig',kind:'swell',x:.41,y:.66}]},
  aquarius:{ name:'AQUARIUS', img:'aquarius.jpg', fx:[
    {t:'pulse',x:.5,y:.12,r:.06,p:4800},
    {t:'emit',x1:.44,y1:.64,x2:.47,y2:.66,dx:.004,dy:.05,rate:1.1,life:1600,sz:1.5},
    {t:'ring',x:.48,y:.9,p:3600,mr:.2},
    {t:'sig',kind:'swell',x:.43,y:.63}]},
  pisces:{ name:'PISCES', img:'pisces.jpg', fx:[
    {t:'pulse',x:.5,y:.12,r:.055,p:4800},
    {t:'pulse',x:.5,y:.52,r:.06,p:3600},
    {t:'orbit',cx:.5,cy:.52,r:.21,ry:.23,p:13000},
    {t:'ring',x:.5,y:.9,p:6000,mr:.28},
    {t:'sig',kind:'swell',x:.5,y:.52}]}
};
const ORDER = ['aries','taurus','gemini','cancer','leo','virgo','libra','scorpio','sagittarius','capricorn','aquarius','pisces'];
const CYCLE = 9000; // signature event interval

/* ============ engine ============ */
const stage=document.getElementById('stage'),heroWrap=document.getElementById('heroWrap'),
      heroImg=document.getElementById('heroImg'),cv=document.getElementById('fx'),
      ctx=cv.getContext('2d'),flash=document.getElementById('flash'),
      arrowEl=document.getElementById('arrowEl'),trail=document.getElementById('trail'),
      nm=document.getElementById('nm');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=null,W=0,H=0,parts=[],sigTimer=null,firing=false;

function px(fx,fy){return [fx*W,fy*H];}

function setSign(key){
  cur=SIGNS[key];parts=[];firing=false;
  clearInterval(sigTimer);
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===key));
  nm.textContent=cur.name;
  arrowEl.style.opacity=0;trail.style.opacity=0;
  heroImg.onload=()=>{layout();if(!reduced){setTimeout(signature,2200);sigTimer=setInterval(signature,CYCLE);}};
  heroImg.src=cur.img;
  heroWrap.style.animation='none';
  requestAnimationFrame(()=>{ if(!reduced){
    const amp=cur.breathe||1.035;
    heroWrap.animate([{transform:'scale(1.012)'},{transform:`scale(${amp})`},{transform:'scale(1.012)'}],
      {duration:9000,iterations:Infinity,easing:'ease-in-out'});}});
}
function layout(){
  const iw=heroImg.naturalWidth,ih=heroImg.naturalHeight;
  stage.style.aspectRatio=iw+'/'+ih;
  const capH=innerHeight*.62,cardW=Math.min(innerWidth*.94,540);
  let h=cardW*ih/iw;
  if(h>capH){stage.style.width=(capH*iw/ih)+'px';stage.style.margin='0 auto';}
  else stage.style.width='100%';
  requestAnimationFrame(()=>{
    const r=stage.getBoundingClientRect();W=r.width;H=r.height;
    cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    seedEmbers();placeArrow();
  });
}

/* ---- ambient canvas fx ---- */
let embers=[];
function seedEmbers(){embers=Array.from({length:18},()=>({x:Math.random()*W,y:Math.random()*H,
  r:.5+Math.random()*1.4,v:.06+Math.random()*.18,ph:Math.random()*6.28}));}
function glow(x,y,r,a,hue='255,214,150'){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${hue},${a})`);g.addColorStop(1,`rgba(${hue},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();
}
function tick(t){
  ctx.clearRect(0,0,W,H);
  if(cur){
    for(const f of cur.fx){
      if(f.t==='pulse'){
        const a=.18+.3*Math.abs(Math.sin(t/f.p*Math.PI));
        const [x,y]=px(f.x,f.y);glow(x,y,f.r*W,a);
      }
      else if(f.t==='alt'){
        const ph=(t%f.p)/f.p, aA=.28*Math.max(0,Math.sin(ph*6.28)), aB=.28*Math.max(0,Math.sin(ph*6.28+3.14));
        const [ax,ay]=px(f.ax,f.ay),[bx,by]=px(f.bx,f.by);
        glow(ax,ay,f.r*W,aA);glow(bx,by,f.r*W,aB);
      }
      else if(f.t==='ring'){
        const ph=(t%f.p)/f.p,[x,y]=px(f.x,f.y),R=ph*f.mr*W;
        ctx.strokeStyle=`rgba(255,220,160,${.5*(1-ph)})`;ctx.lineWidth=1.4;
        ctx.beginPath();ctx.ellipse(x,y,R,R*.32,0,0,6.28);ctx.stroke();
      }
      else if(f.t==='orbit'){
        const ph=(t%f.p)/f.p*6.28,[cx,cy]=px(f.cx,f.cy);
        for(const off of [0,3.14]){
          const x=cx+Math.cos(ph+off)*f.r*W,y=cy+Math.sin(ph+off)*f.ry*H;
          glow(x,y,14,.55,'255,235,190');glow(x,y,4,.9,'255,255,240');
        }
      }
      else if(f.t==='flicker'){
        for(const p of f.pts){
          const [x,y]=px(p[0],p[1]);
          const a=.25+.3*Math.abs(Math.sin(t/230+x));
          glow(x,y,f.r*W,a,'255,190,110');
        }
      }
      else if(f.t==='sweep'){
        const ph=(t%f.p)/f.p, x=(-0.3+1.6*ph)*W;
        const g=ctx.createLinearGradient(x-90,0,x+90,0);
        g.addColorStop(0,'rgba(255,230,180,0)');g.addColorStop(.5,'rgba(255,230,180,.07)');g.addColorStop(1,'rgba(255,230,180,0)');
        ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-.35);ctx.translate(-W/2,-H/2);
        ctx.fillStyle=g;ctx.fillRect(x-120,-H,240,H*3);ctx.restore();
      }
      else if(f.t==='emit'){
        if(Math.random()<f.rate){
          const u=Math.random();
          parts.push({x:(f.x1+(f.x2-f.x1)*u)*W,y:(f.y1+(f.y2-f.y1)*u)*H,
            vx:f.dx*W/60+(Math.random()-.5)*.3,vy:f.dy*H/60+(Math.random()-.5)*.2,
            born:t,life:f.life,sz:f.sz});
        }
      }
    }
  }
  // particles
  parts=parts.filter(p=>t-p.born<p.life);
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;
    const k=1-(t-p.born)/p.life;
    glow(p.x,p.y,p.sz*3,.5*k,'255,236,200');
  }
  // embers
  for(const e of embers){
    e.y-=e.v;if(e.y<-4){e.y=H+4;e.x=Math.random()*W;}
    glow(e.x,e.y,e.r*2.4,.16+.22*Math.abs(Math.sin(t/900+e.ph)));
  }
  requestAnimationFrame(tick);
}

/* ---- signature events ---- */
function signature(){
  if(!cur||firing)return;
  const sig=cur.fx.find(f=>f.t==='sig');if(!sig)return;
  const [x,y]=sig.x!=null?px(sig.x,sig.y):[W/2,H/2];
  flash.style.setProperty('--fx',(x/W*100)+'%');flash.style.setProperty('--fy',(y/H*100)+'%');
  if(sig.kind==='arrow'){fireArrow();return;}
  firing=true;
  if(sig.kind==='stomp'){
    stage.animate([{transform:'translate(0,0)'},{transform:'translate(0,3px)'},{transform:'translate(0,-2px)'},{transform:'translate(0,0)'}],{duration:340,easing:'ease-out'});
    burst(x,y,14,1.9);ringOnce(x,y,.34);flashPulse(.7);
    if(navigator.vibrate)navigator.vibrate(14);
  }
  else if(sig.kind==='roar'){
    ringOnce(x,y,.42);ringOnce(x,y,.42,180);flashPulse(.5);
    if(navigator.vibrate)navigator.vibrate(10);
  }
  else if(sig.kind==='sting'){
    // charge then strike
    const chargeEnd=performance.now()+900;
    (function ch(){const n=performance.now();
      if(n<chargeEnd){glowFrame(x,y,60,(1-(chargeEnd-n)/900)*.8);requestAnimationFrame(ch);}
      else{burst(x,y,16,2.2);flashPulse(.85);if(navigator.vibrate)navigator.vibrate(20);}})();
  }
  else{ // swell
    burst(x,y,8,1.2);flashPulse(.35);
  }
  setTimeout(()=>firing=false,1400);
}
function glowFrame(x,y,r,a){ctx.save();ctx.globalCompositeOperation='lighter';glow(x,y,r,a,'255,220,150');ctx.restore();}
function burst(x,y,n,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,d=(0.4+Math.random())*sp;
    parts.push({x,y,vx:Math.cos(a)*d,vy:Math.sin(a)*d-.4,born:performance.now(),life:600+Math.random()*500,sz:1.6});
  }
}
let rings=[];
function ringOnce(x,y,mr,delay=0){
  setTimeout(()=>{const start=performance.now();
    (function r(){const ph=(performance.now()-start)/1100;
      if(ph<1){ctx.save();ctx.strokeStyle=`rgba(255,225,170,${.6*(1-ph)})`;ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(x,y,ph*mr*W,ph*mr*W*.3,0,0,6.28);ctx.stroke();ctx.restore();
        requestAnimationFrame(r);}})();},delay);
}
function flashPulse(peak){flash.animate([{opacity:0},{opacity:peak,offset:.15},{opacity:0}],{duration:620,easing:'ease-out'});}

/* ---- Sagittarius arrow ---- */
let shaftPx=0,drawPx=0,nockX=0,nockY=0;
function placeArrow(){
  const A=cur&&cur.arrow;if(!A){arrowEl.style.opacity=0;return;}
  shaftPx=A.shaft*W;drawPx=A.draw*W;
  const rad=A.deg*Math.PI/180;
  nockX=A.ax*W-Math.cos(rad)*shaftPx;nockY=A.ay*H-Math.sin(rad)*shaftPx;
  arrowEl.style.left=nockX+'px';arrowEl.style.top=nockY+'px';
  const h=Math.max(8,shaftPx*.05);
  arrowEl.innerHTML=`<svg width="${shaftPx+16}" height="${h*4}" viewBox="0 0 ${shaftPx+16} ${h*4}">
    <g transform="translate(0,${h*2})" filter="drop-shadow(0 0 5px rgba(255,214,140,.95))">
      <path d="M2 0 L${h*1.5} ${-h*.85} M2 0 L${h*1.5} ${h*.85} M${h} 0 L${h*2.5} ${-h*.85} M${h} 0 L${h*2.5} ${h*.85}" stroke="#e8b968" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
      <line x1="2" y1="0" x2="${shaftPx}" y2="0" stroke="#f6d79a" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M${shaftPx} 0 L${shaftPx-h*1.4} ${-h*.7} L${shaftPx-h*.5} 0 L${shaftPx-h*1.4} ${h*.7} Z" fill="#fff2d6"/>
    </g></svg>`;
  trail.style.left=nockX+'px';trail.style.top=nockY+'px';
  setArrow(0,0);
}
function setArrow(dx,op,ms=0,ease='cubic-bezier(.22,1,.36,1)'){
  const A=cur.arrow;
  arrowEl.style.transition=ms?`transform ${ms}ms ${ease}, opacity ${Math.min(ms,450)}ms ease`:'none';
  arrowEl.style.transform=`rotate(${A.deg}deg) translateX(${dx}px)`;
  arrowEl.style.opacity=op;
}
function fireArrow(){
  if(firing)return;firing=true;
  const A=cur.arrow,[hx,hy]=px(A.ax,A.ay);
  flash.style.setProperty('--fx',(A.ax*100)+'%');flash.style.setProperty('--fy',(A.ay*100)+'%');
  setArrow(0,0);
  requestAnimationFrame(()=>{
    setArrow(0,1,400,'ease-out');
    setTimeout(()=>{stage.classList.add('tension');setArrow(-drawPx,1,1300,'cubic-bezier(.3,.9,.4,1)');
      (function ch(){if(!firing)return;glowFrame(hx,hy,44,.5);if(arrowEl.style.opacity==='1')requestAnimationFrame(ch);})();
    },440);
    setTimeout(()=>{
      const flight=W*1.3;
      setArrow(flight,1,500,'cubic-bezier(.55,0,.9,.4)');
      trail.style.transition='none';trail.style.opacity='1';
      trail.style.width=(flight+shaftPx)+'px';
      trail.style.transform=`rotate(${A.deg}deg) scaleX(0)`;
      requestAnimationFrame(()=>{
        trail.style.transition='transform 500ms cubic-bezier(.55,0,.9,.4), opacity 650ms ease 240ms';
        trail.style.transform=`rotate(${A.deg}deg) scaleX(1)`;trail.style.opacity='0';
      });
      burst(hx,hy,12,2);flashPulse(.8);
      if(navigator.vibrate)navigator.vibrate(18);
      setTimeout(()=>{setArrow(0,0);firing=false;},1200);
    },2300);
  });
}

/* ---- interaction ---- */
stage.addEventListener('click',()=>{
  if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
    DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')gyro();}).catch(()=>{});
  }
  signature();
});
function gyro(){addEventListener('deviceorientation',e=>{
  if(e.gamma==null)return;
  const x=Math.max(-1,Math.min(1,e.gamma/30)),y=Math.max(-1,Math.min(1,(e.beta-45)/30));
  heroWrap.style.translate=`${x*-6}px ${y*-4}px`;});}
if(typeof DeviceOrientationEvent!=='undefined'&&!DeviceOrientationEvent.requestPermission)gyro();

/* ---- chips ---- */
const chips=document.getElementById('chips');
for(const k of ORDER){
  const b=document.createElement('button');b.className='chip';b.dataset.k=k;
  b.textContent=SIGNS[k].name;b.onclick=()=>setSign(k);chips.appendChild(b);
}
addEventListener('resize',layout);
setSign('sagittarius');
requestAnimationFrame(tick);
</script>
</body>
</html>
