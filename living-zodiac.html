<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Living Zodiac</title>
<!-- LIVING ZODIAC · v1 -->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:Georgia,serif}

#stage{position:fixed;inset:0;overflow:hidden;background:#000}

/* ---- layers (back to front) ---- */
.layer{position:absolute;inset:0;will-change:transform}

/* the illustration */
#art{
  position:absolute; inset:-6%;
  background-size:cover; background-position:center 20%;
  animation:kenburns 26s ease-in-out infinite alternate;
  transition:opacity 1.2s ease;
}
@keyframes kenburns{
  0%  {transform:scale(1.06) translate(0,0)}
  100%{transform:scale(1.13) translate(-1.2%,-1.4%)}
}

/* rotating mandala rings */
#rings{
  position:absolute; left:50%; width:150vmin; height:150vmin;
  mix-blend-mode:screen; opacity:.5; pointer-events:none;
}
#ringA,#ringB{position:absolute;inset:0}
#ringA{animation:spin 150s linear infinite}
#ringB{animation:spinBack 220s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinBack{to{transform:rotate(-360deg)}}

/* sigil glow */
#sigil{
  position:absolute; width:46vmin; height:46vmin; pointer-events:none;
  background:radial-gradient(circle, rgba(255,214,130,.55) 0%, rgba(255,190,90,.18) 35%, transparent 70%);
  mix-blend-mode:screen;
  animation:sigilPulse 6s ease-in-out infinite;
}
@keyframes sigilPulse{
  0%,100%{opacity:.35; transform:translate(-50%,-50%) scale(.92)}
  50%    {opacity:.85; transform:translate(-50%,-50%) scale(1.05)}
}

/* slow light sweep */
#sweep{
  position:absolute; inset:-20%;
  background:linear-gradient(115deg, transparent 30%, rgba(255,215,140,.10) 46%, rgba(255,215,140,.16) 50%, rgba(255,215,140,.10) 54%, transparent 70%);
  mix-blend-mode:screen;
  animation:sweep 18s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes sweep{from{transform:translateX(-14%)}to{transform:translateX(14%)}}

/* embers */
#embers{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}

/* breathing vignette */
#vig{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%, transparent 45%, rgba(0,0,0,.55) 100%);
  animation:vig 9s ease-in-out infinite alternate;
}
@keyframes vig{from{opacity:.75}to{opacity:1}}

/* ---- ui ---- */
#curtain{
  position:fixed; inset:0; z-index:100; background:#000;
  display:flex; align-items:center; justify-content:center;
  transition:opacity 1.8s ease;
}
#curtain.gone{opacity:0;pointer-events:none}
#tapPrompt{color:#bfa06a;font-size:15px;letter-spacing:.42em;font-variant:small-caps;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.85}}

#signs{
  position:fixed; left:0; right:0; bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:50; display:flex; justify-content:center; gap:26px;
}
#signs button{
  background:none;border:none;color:rgba(201,163,92,.45);
  font-family:Georgia,serif;font-size:12px;letter-spacing:.3em;font-variant:small-caps;
  padding:8px 4px;cursor:pointer;transition:color .6s ease;
}
#signs button.on{color:rgba(232,199,138,.95);text-shadow:0 0 12px rgba(232,199,138,.5)}

#tag{position:fixed;right:8px;bottom:6px;z-index:99;font-size:9px;letter-spacing:.08em;color:rgba(201,163,92,.35);pointer-events:none}

@media (prefers-reduced-motion:reduce){
  #art,#ringA,#ringB,#sigil,#sweep,#vig,#tapPrompt{animation:none}
}
</style>
</head>
<body>

<div id="curtain"><div id="tapPrompt">tap to awaken</div></div>
<div id="tag">LIVING ZODIAC · v1</div>

<div id="stage">
  <div class="layer" id="pArt"><div id="art"></div></div>
  <div class="layer" id="pRings">
    <div id="rings">
      <svg id="ringA" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(232,199,138,.5)" stroke-width=".14"/>
        <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(232,199,138,.32)" stroke-width=".1" stroke-dasharray=".3 2.2"/>
        <g id="ticksA"></g>
      </svg>
      <svg id="ringB" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="43" fill="none" stroke="rgba(232,199,138,.28)" stroke-width=".1" stroke-dasharray="4 3"/>
        <g id="ticksB"></g>
      </svg>
    </div>
    <div id="sigil"></div>
  </div>
  <div class="layer" id="pFx">
    <div id="sweep"></div>
    <canvas id="embers"></canvas>
  </div>
  <div id="vig"></div>
</div>

<div id="signs">
  <button data-s="sagittarius">Sagittarius</button>
  <button data-s="gemini">Gemini</button>
  <button data-s="leo" class="on">Leo</button>
</div>

<script>
/* ---- per-sign placement (sigil + ring center, % of viewport) ---- */
const SIGNS={
  sagittarius:{img:'sagittarius.jpg', sigil:{x:50,y:15}, ring:{x:50,y:36}},
  gemini:     {img:'gemini.jpg',      sigil:{x:50,y:14}, ring:{x:50,y:38}},
  leo:        {img:'leo.jpg',         sigil:{x:50,y:15}, ring:{x:50,y:40}}
};
const $=id=>document.getElementById(id);
const art=$('art'), rings=$('rings'), sigil=$('sigil');

function setSign(key){
  const s=SIGNS[key];
  art.style.opacity=0;
  const im=new Image();
  im.onload=()=>{ art.style.backgroundImage=`url(${s.img})`; art.style.opacity=1; };
  im.src=s.img;
  rings.style.top=`calc(${s.ring.y}% )`; rings.style.transform='translate(-50%,-50%)';
  sigil.style.left=s.sigil.x+'%'; sigil.style.top=s.sigil.y+'%';
  document.querySelectorAll('#signs button').forEach(b=>b.classList.toggle('on',b.dataset.s===key));
}
document.querySelectorAll('#signs button').forEach(b=>b.addEventListener('click',()=>setSign(b.dataset.s)));

/* ring tick marks */
(function(){
  const mk=(g,n,r,len,w,op)=>{
    let h='';
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2, c=Math.cos(a), s=Math.sin(a);
      h+=`<line x1="${50+c*r}" y1="${50+s*r}" x2="${50+c*(r-len)}" y2="${50+s*(r-len)}" stroke="rgba(232,199,138,${op})" stroke-width="${w}"/>`;
    }
    g.innerHTML=h;
  };
  mk($('ticksA'),72,46,1.1,.1,.45);
  mk($('ticksB'),12,43,2.2,.16,.4);
})();

/* ---- embers ---- */
const cv=$('embers'), cx=cv.getContext('2d');
let W,H,DPR,parts=[];
function sizeCv(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  cx.setTransform(DPR,0,0,DPR,0,0);
}
sizeCv(); addEventListener('resize',sizeCv);
function spawn(y){
  return {x:Math.random()*W, y:y??(H+10), r:.6+Math.random()*1.7,
          vy:.12+Math.random()*.3, sway:Math.random()*Math.PI*2,
          sw:.15+Math.random()*.35, tw:Math.random()*Math.PI*2, a:.25+Math.random()*.5};
}
for(let i=0;i<55;i++) parts.push(spawn(Math.random()*H));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(t){
  cx.clearRect(0,0,W,H);
  for(let p of parts){
    p.y-=p.vy; p.sway+=.008; p.tw+=.05;
    if(p.y<-12) Object.assign(p,spawn());
    const x=p.x+Math.sin(p.sway)*14;
    const a=p.a*(0.55+0.45*Math.sin(p.tw));
    cx.beginPath();
    cx.fillStyle=`rgba(255,208,130,${a})`;
    cx.arc(x,p.y,p.r,0,Math.PI*2); cx.fill();
  }
  if(!reduced) requestAnimationFrame(tick);
}

/* ---- parallax: gyro on iPhone, pointer fallback ---- */
const depth=[['pArt',6],['pRings',14],['pFx',22]];
let tx=0,ty=0,cxr=0,cyr=0;
function applyPx(){
  cxr+=(tx-cxr)*.05; cyr+=(ty-cyr)*.05;
  for(const [id,d] of depth)
    $(id).style.transform=`translate(${cxr*d}px, ${cyr*d}px)`;
  requestAnimationFrame(applyPx);
}
function wireGyro(){
  addEventListener('deviceorientation',e=>{
    if(e.gamma==null) return;
    tx=Math.max(-1,Math.min(1,e.gamma/28));
    ty=Math.max(-1,Math.min(1,(e.beta-48)/28));
  });
}
addEventListener('pointermove',e=>{
  tx=(e.clientX/W-.5)*1.6; ty=(e.clientY/H-.5)*1.6;
});

/* ---- gate ---- */
setSign('leo');
$('curtain').addEventListener('pointerup',async function go(){
  $('curtain').removeEventListener('pointerup',go);
  if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
    try{ if(await DeviceOrientationEvent.requestPermission()==='granted') wireGyro(); }catch(e){}
  }else wireGyro();
  $('curtain').classList.add('gone');
  if(!reduced){ requestAnimationFrame(tick); requestAnimationFrame(applyPx); }
},{once:true});
</script>
</body>
</html>
